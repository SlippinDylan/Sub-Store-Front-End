name: Worker Check

on:
  push:
    branches:
      - worker
  pull_request:
    branches:
      - worker

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check locales
        run: pnpm check:locales

      - name: Validate Static Assets Worker
        run: pnpm check:worker
