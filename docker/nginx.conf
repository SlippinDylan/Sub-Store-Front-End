server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /chunks/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
